<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — AI Agent Marketplace</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#06C7CC;--teal-d:#0AA8AC;--teal-bg:#E8FAFA;
  --navy:#000048;--indigo:#2E308E;--blue:#2F78C4;
  --white:#fff;--bg:#F2F5F9;--card:#fff;
  --border:#DDE3ED;--text:#1A1A3A;--muted:#64748B;--light:#F8FAFC;
  --green:#1D9E5C;--amber:#D97706;--red:#DC2626;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:var(--white);border-radius:12px;padding:40px;width:360px}
.login-logo{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:28px}
.login-box h2{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:20px}
.login-err{font-size:12px;color:var(--red);margin-bottom:12px;display:none}

/* HEADER */
header{background:var(--navy);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.logo-text{font-size:14px;font-weight:600;color:#fff}
.admin-badge{font-size:11px;font-weight:600;color:var(--amber);background:rgba(217,119,6,.15);border:1px solid rgba(217,119,6,.3);padding:3px 10px;border-radius:20px}
.logout-btn{font-size:12px;font-weight:500;color:rgba(255,255,255,.6);background:none;border:1px solid rgba(255,255,255,.15);padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
.logout-btn:hover{color:#fff;border-color:rgba(255,255,255,.4)}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 52px)}
.sidebar{width:220px;background:var(--white);border-right:1px solid var(--border);padding:20px 0;flex-shrink:0}
.sidebar-section{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:0 16px;margin-bottom:6px;margin-top:16px}
.sidebar-section:first-child{margin-top:0}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-left:2.5px solid transparent;transition:all .15s}
.nav-item:hover{color:var(--navy);background:var(--bg)}
.nav-item.active{color:var(--navy);background:var(--teal-bg);border-left-color:var(--teal)}
.nav-count{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;background:var(--bg);color:var(--muted);padding:1px 6px;border-radius:8px}
.nav-item.active .nav-count{background:rgba(6,199,204,.15);color:var(--teal-d)}

/* CONTENT */
.content{flex:1;padding:28px 32px;overflow-y:auto}
.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.content-title{font-size:18px;font-weight:700;color:var(--navy)}
.btn{padding:8px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;border:none}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:#0a0a6e}
.btn-danger{background:#FEE2E2;color:var(--red);border:1px solid #FECACA}
.btn-danger:hover{background:#FECACA}
.btn-ghost{background:none;color:var(--muted);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--teal-d);color:var(--teal-d)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}

/* TABLE */
.table-wrap{background:var(--white);border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--light);border-bottom:1.5px solid var(--border)}
th{padding:10px 16px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;text-align:left}
td{padding:12px 16px;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--light)}
.status-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em}
.s-active{background:#DCFCE7;color:#166534}
.s-planned{background:#F1F5F9;color:var(--muted)}
.s-exploring{background:#FFF7ED;color:#92400E}
.s-pipeline{background:#EEF3FB;color:var(--indigo)}
.color-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.confirmed-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px}
.cb-yes{background:#DCFCE7;color:#166534}
.cb-no{background:#F1F5F9;color:var(--muted)}
.actions{display:flex;gap:6px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,48,.5);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:12px;width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,48,.2)}
.modal-header{padding:22px 24px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1}
.modal-title{font-size:16px;font-weight:700;color:var(--navy)}
.modal-close{width:28px;height:28px;border-radius:6px;background:var(--bg);border:none;cursor:pointer;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#FFE5E5;color:var(--red)}
.modal-body{padding:22px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--white)}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:5px}
label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
input[type=text],input[type=email],input[type=password],select,textarea{
  padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--white);transition:border-color .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal-d)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.hint{font-size:11px;color:var(--muted);line-height:1.4}
.field-sep{grid-column:1/-1;border-top:1px solid var(--border);margin:4px 0}

/* STEPS EDITOR */
.steps-editor{background:var(--light);border:1.5px solid var(--border);border-radius:8px;padding:12px}
.step-row{display:grid;grid-template-columns:60px 1fr 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.step-row:last-child{margin-bottom:0}
.remove-step{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:8px 4px;transition:color .15s;margin-top:1px}
.remove-step:hover{color:var(--red)}
.add-step-btn{font-size:12px;font-weight:600;color:var(--teal-d);background:none;border:1.5px dashed var(--teal);padding:6px 14px;border-radius:7px;cursor:pointer;margin-top:8px;width:100%;font-family:'DM Sans',sans-serif}
.add-step-btn:hover{background:var(--teal-bg)}

/* ARRAY INPUT */
.array-item{display:flex;gap:6px;margin-bottom:6px}
.array-item input{flex:1}
.array-item button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:4px 6px}
.array-item button:hover{color:var(--red)}
.add-array-btn{font-size:12px;color:var(--teal-d);background:none;border:1.5px dashed var(--teal);padding:5px 12px;border-radius:7px;cursor:pointer;font-family:'DM Sans',sans-serif}
.add-array-btn:hover{background:var(--teal-bg)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;transform:translateY(60px);opacity:0;transition:all .25s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{background:var(--red)}

/* LOADING */
.page-loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);font-size:13px;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">AI Agent Marketplace</div>
    <div class="login-sub">Admin Panel</div>
    <h2>Sign in</h2>
    <div class="login-err" id="loginErr"></div>
    <div class="field" style="margin-bottom:14px">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@yourteam.com">
    </div>
    <div class="field" style="margin-bottom:20px">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" style="width:100%;padding:11px" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header>
    <div class="logo-text">AI Agent Marketplace <span style="color:rgba(255,255,255,.4);margin:0 6px">·</span> <span style="color:rgba(255,255,255,.7);font-weight:400">Admin</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="admin-badge">Admin Mode</div>
      <a href="index.html" target="_blank" style="font-size:12px;color:rgba(255,255,255,.6);text-decoration:none">View Marketplace ↗</a>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-section">Content</div>
      <div class="nav-item active" onclick="showSection('usecases',this)">
        Use Cases <span class="nav-count" id="navUC">—</span>
      </div>
      <div class="nav-item" onclick="showSection('agents',this)">
        Agents <span class="nav-count" id="navAG">—</span>
      </div>
    </div>

    <div class="content" id="contentArea">
      <div class="page-loading"><div class="spinner"></div> Loading...</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Edit</div>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSave" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── GLOBALS ──────────────────────────────────────────────────
let SESSION = null;
let UC = [], AG = [], STEPS = {};
let curSection = 'usecases';
let editingItem = null, editingType = null;

const HEADERS = () => ({
  'apikey': SUPABASE_ANON,
  'Authorization': `Bearer ${SESSION.access_token}`,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
});
const BASE = () => SUPABASE_URL + '/rest/v1';
const AUTH = () => SUPABASE_URL + '/auth/v1';

// ── AUTH ─────────────────────────────────────────────────────
async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const err      = document.getElementById('loginErr');
  err.style.display = 'none';
  try {
    const res = await fetch(`${AUTH()}/token?grant_type=password`, {
      method:'POST',
      headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'},
      body: JSON.stringify({email,password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');
    SESSION = data;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await loadAll();
    renderSection('usecases');
  } catch(e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

function doLogout() {
  SESSION = null; UC = []; AG = []; STEPS = {};
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ── DATA ─────────────────────────────────────────────────────
async function loadAll() {
  const h = {'apikey':SUPABASE_ANON,'Authorization':`Bearer ${SESSION.access_token}`};
  const [ucRes, agRes, stepsRes] = await Promise.all([
    fetch(`${BASE()}/use_cases?select=*&order=sort_order`, {headers:h}),
    fetch(`${BASE()}/agents?select=*&order=sort_order`, {headers:h}),
    fetch(`${BASE()}/agent_steps?select=*&order=agent_id,sort_order`, {headers:h})
  ]);
  UC    = await ucRes.json();
  AG    = await agRes.json();
  const rawSteps = await stepsRes.json();
  STEPS = {};
  rawSteps.forEach(s => { if(!STEPS[s.agent_id]) STEPS[s.agent_id]=[]; STEPS[s.agent_id].push(s); });
  document.getElementById('navUC').textContent = UC.length;
  document.getElementById('navAG').textContent = AG.length;
}

// ── SECTIONS ─────────────────────────────────────────────────
function showSection(name, el) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  renderSection(name);
}

function renderSection(name) {
  curSection = name;
  const ca = document.getElementById('contentArea');
  if (name === 'usecases') {
    ca.innerHTML = `
      <div class="content-header">
        <div class="content-title">Use Cases <span style="font-size:13px;font-weight:400;color:var(--muted);margin-left:8px">${UC.length} total</span></div>
        <button class="btn btn-primary" onclick="openNewUC()">+ Add Use Case</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Status</th><th>Group</th><th>Agents</th><th>Color</th><th>Actions</th></tr></thead>
          <tbody>${UC.map(uc=>`
            <tr>
              <td style="font-weight:600">${uc.name}</td>
              <td><span class="status-pill s-${uc.status}">${uc.status}</span></td>
              <td><code style="font-size:11px;background:var(--bg);padding:2px 6px;border-radius:4px">${uc.group_id}</code></td>
              <td><span class="tag-plain" style="font-size:11px">${(uc.agent_ids||[]).length} agents</span></td>
              <td><span class="color-dot" style="background:${uc.color}"></span><code style="font-size:11px">${uc.color}</code></td>
              <td><div class="actions">
                <button class="btn btn-ghost btn-sm" onclick='editUC(${JSON.stringify(uc).replace(/'/g,"&#39;")})'>Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteItem('use_cases','${uc.id}','${uc.name.replace(/'/g,"&#39;")}')">Delete</button>
              </div></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } else {
    ca.innerHTML = `
      <div class="content-header">
        <div class="content-title">Agents <span style="font-size:13px;font-weight:400;color:var(--muted);margin-left:8px">${AG.length} total</span></div>
        <button class="btn btn-primary" onclick="openNewAG()">+ Add Agent</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Group</th><th>Confirmed</th><th>Color</th><th>Steps</th><th>Actions</th></tr></thead>
          <tbody>${AG.map(ag=>`
            <tr>
              <td style="font-weight:600">${ag.name}</td>
              <td><code style="font-size:11px;background:var(--bg);padding:2px 6px;border-radius:4px">${ag.group_id}</code></td>
              <td><span class="confirmed-badge ${ag.confirmed?'cb-yes':'cb-no'}">${ag.confirmed?'Confirmed':'Pending'}</span></td>
              <td><span class="color-dot" style="background:${ag.color}"></span><code style="font-size:11px">${ag.color}</code></td>
              <td><span class="tag-plain" style="font-size:11px">${(STEPS[ag.id]||[]).length} steps</span></td>
              <td><div class="actions">
                <button class="btn btn-ghost btn-sm" onclick='editAG(${JSON.stringify(ag).replace(/'/g,"&#39;")})'>Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteItem('agents','${ag.id}','${ag.name.replace(/'/g,"&#39;")}')">Delete</button>
              </div></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }
}

// ── USE CASE MODAL ───────────────────────────────────────────
function buildUCForm(uc) {
  const agentList  = (uc && uc.agent_ids)  ? uc.agent_ids  : [];
  const sharedList = (uc && uc.shared_ids) ? uc.shared_ids : [];
  return `
    <div class="form-grid">
      <div class="field"><label>ID (slug)</label><input type="text" id="f_id" value="${uc?uc.id:''}" placeholder="e.g. tc-gen" ${uc?'readonly':''}><div class="hint">Unique identifier. Cannot be changed after creation.</div></div>
      <div class="field"><label>Status</label>
        <select id="f_status">
          ${['active','planned','exploring','pipeline'].map(s=>`<option value="${s}" ${uc&&uc.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="grid-column:1/-1"><label>Name</label><input type="text" id="f_name" value="${uc?uc.name:''}" placeholder="Requirement to Test Case Generation"></div>
      <div class="field"><label>Group ID</label><input type="text" id="f_group_id" value="${uc?uc.group_id:''}" placeholder="p1 / p2 / dsr / mom…"></div>
      <div class="field"><label>Color (hex)</label><input type="text" id="f_color" value="${uc?uc.color:'#2E308E'}" placeholder="#2E308E"></div>
      <div class="field"><label>Sort Order</label><input type="text" id="f_sort_order" value="${uc?uc.sort_order:0}"></div>
      <div class="field-sep"></div>
      <div class="field" style="grid-column:1/-1"><label>Short Description (card)</label><textarea id="f_short_desc" rows="2">${uc?uc.short_desc:''}</textarea></div>
      <div class="field" style="grid-column:1/-1"><label>Tagline (drawer detail)</label><textarea id="f_tagline" rows="4">${uc?uc.tagline:''}</textarea></div>
      <div class="field" style="grid-column:1/-1"><label>Output Description</label><textarea id="f_output_desc" rows="2">${uc?uc.output_desc:''}</textarea></div>
      <div class="field-sep"></div>
      <div class="field" style="grid-column:1/-1">
        <label>Agent IDs (ordered pipeline)</label>
        <div id="agentIds">${agentList.map(id=>`<div class="array-item"><input type="text" value="${id}"><button onclick="this.parentElement.remove()">✕</button></div>`).join('')}</div>
        <button class="add-array-btn" onclick="addArrayItem('agentIds')">+ Add Agent ID</button>
        <div class="hint">Enter agent IDs in pipeline order. Available: ${AG.map(a=>a.id).join(', ')}</div>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Shared Agent IDs</label>
        <div id="sharedIds">${sharedList.map(id=>`<div class="array-item"><input type="text" value="${id}"><button onclick="this.parentElement.remove()">✕</button></div>`).join('')}</div>
        <button class="add-array-btn" onclick="addArrayItem('sharedIds')">+ Add Shared ID</button>
      </div>
    </div>`;
}

function openNewUC() {
  editingItem = null; editingType = 'uc';
  document.getElementById('modalTitle').textContent = 'Add Use Case';
  document.getElementById('modalBody').innerHTML = buildUCForm(null);
  openModal();
}
function editUC(uc) {
  editingItem = uc; editingType = 'uc';
  document.getElementById('modalTitle').textContent = 'Edit Use Case';
  document.getElementById('modalBody').innerHTML = buildUCForm(uc);
  openModal();
}

// ── AGENT MODAL ──────────────────────────────────────────────
function buildAGForm(ag) {
  const inputs  = (ag && ag.inputs)  ? ag.inputs  : [];
  const outputs = (ag && ag.outputs) ? ag.outputs : [];
  const steps   = ag ? (STEPS[ag.id] || []) : [];
  return `
    <div class="form-grid">
      <div class="field"><label>ID (slug)</label><input type="text" id="f_id" value="${ag?ag.id:''}" placeholder="e.g. jira-connector" ${ag?'readonly':''}></div>
      <div class="field"><label>Group</label>
        <select id="f_group_id">
          ${['core','p1','p2','p3','other'].map(g=>`<option value="${g}" ${ag&&ag.group_id===g?'selected':''}>${g}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="grid-column:1/-1"><label>Name</label><input type="text" id="f_name" value="${ag?ag.name:''}" placeholder="JIRA Connector Agent"></div>
      <div class="field"><label>Color (hex)</label><input type="text" id="f_color" value="${ag?ag.color:'#2E308E'}"></div>
      <div class="field"><label>Confirmed</label>
        <select id="f_confirmed">
          <option value="false" ${ag&&!ag.confirmed?'selected':''}>Pending</option>
          <option value="true"  ${ag&&ag.confirmed?'selected':''}>Confirmed</option>
        </select>
      </div>
      <div class="field"><label>Sort Order</label><input type="text" id="f_sort_order" value="${ag?ag.sort_order:0}"></div>
      <div class="field-sep"></div>
      <div class="field" style="grid-column:1/-1"><label>Short Description (card)</label><textarea id="f_short_desc" rows="2">${ag?ag.short_desc:''}</textarea></div>
      <div class="field" style="grid-column:1/-1"><label>Tagline (drawer detail)</label><textarea id="f_tagline" rows="4">${ag?ag.tagline:''}</textarea></div>
      <div class="field-sep"></div>
      <div class="field" style="grid-column:1/-1">
        <label>Inputs</label>
        <div id="agInputs">${inputs.map(v=>`<div class="array-item"><input type="text" value="${v}"><button onclick="this.parentElement.remove()">✕</button></div>`).join('')}</div>
        <button class="add-array-btn" onclick="addArrayItem('agInputs')">+ Add Input</button>
      </div>
      <div class="field" style="grid-column:1/-1">
        <label>Outputs</label>
        <div id="agOutputs">${outputs.map(v=>`<div class="array-item"><input type="text" value="${v}"><button onclick="this.parentElement.remove()">✕</button></div>`).join('')}</div>
        <button class="add-array-btn" onclick="addArrayItem('agOutputs')">+ Add Output</button>
      </div>
      <div class="field-sep"></div>
      <div class="field" style="grid-column:1/-1">
        <label>How It Works — Steps</label>
        <div class="steps-editor">
          <div style="display:grid;grid-template-columns:60px 1fr 1fr auto;gap:8px;margin-bottom:6px">
            <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Number</span>
            <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Step Name</span>
            <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Description</span>
            <span></span>
          </div>
          <div id="stepsContainer">
            ${steps.map(s=>`
              <div class="step-row">
                <input type="text" value="${s.step_number}" placeholder="1">
                <input type="text" value="${s.step_name}" placeholder="Step name">
                <input type="text" value="${s.step_desc}" placeholder="Step description">
                <button class="remove-step" onclick="this.closest('.step-row').remove()">✕</button>
              </div>`).join('')}
          </div>
          <button class="add-step-btn" onclick="addStep()">+ Add Step</button>
        </div>
        <div class="hint" style="margin-top:6px">Use ★ as the number for special/highlighted steps.</div>
      </div>
    </div>`;
}

function openNewAG() {
  editingItem = null; editingType = 'ag';
  document.getElementById('modalTitle').textContent = 'Add Agent';
  document.getElementById('modalBody').innerHTML = buildAGForm(null);
  openModal();
}
function editAG(ag) {
  editingItem = ag; editingType = 'ag';
  document.getElementById('modalTitle').textContent = 'Edit Agent';
  document.getElementById('modalBody').innerHTML = buildAGForm(ag);
  openModal();
}

// ── HELPERS ──────────────────────────────────────────────────
function addArrayItem(containerId) {
  const c = document.getElementById(containerId);
  const d = document.createElement('div');
  d.className = 'array-item';
  d.innerHTML = `<input type="text" placeholder="value"><button onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(d);
}
function addStep() {
  const c = document.getElementById('stepsContainer');
  const d = document.createElement('div');
  d.className = 'step-row';
  d.innerHTML = `<input type="text" placeholder="1"><input type="text" placeholder="Step name"><input type="text" placeholder="Description"><button class="remove-step" onclick="this.closest('.step-row').remove()">✕</button>`;
  c.appendChild(d);
}
function getArrayValues(containerId) {
  return Array.from(document.querySelectorAll(`#${containerId} input`)).map(i=>i.value.trim()).filter(Boolean);
}

// ── SAVE ─────────────────────────────────────────────────────
async function saveModal() {
  const saveBtn = document.getElementById('modalSave');
  saveBtn.textContent = 'Saving…'; saveBtn.disabled = true;
  try {
    if (editingType === 'uc') await saveUC();
    else await saveAG();
    closeModal();
    await loadAll();
    renderSection(curSection);
    toast('Saved successfully');
  } catch(e) {
    toast(e.message, true);
  } finally {
    saveBtn.textContent = 'Save'; saveBtn.disabled = false;
  }
}

async function saveUC() {
  const id = document.getElementById('f_id').value.trim();
  if (!id) throw new Error('ID is required');
  const payload = {
    id,
    name:         document.getElementById('f_name').value.trim(),
    status:       document.getElementById('f_status').value,
    group_id:     document.getElementById('f_group_id').value.trim(),
    color:        document.getElementById('f_color').value.trim(),
    sort_order:   parseInt(document.getElementById('f_sort_order').value)||0,
    short_desc:   document.getElementById('f_short_desc').value.trim(),
    tagline:      document.getElementById('f_tagline').value.trim(),
    output_desc:  document.getElementById('f_output_desc').value.trim(),
    agent_ids:    getArrayValues('agentIds'),
    shared_ids:   getArrayValues('sharedIds'),
  };
  const method = editingItem ? 'PATCH' : 'POST';
  const url    = editingItem
    ? `${BASE()}/use_cases?id=eq.${id}`
    : `${BASE()}/use_cases`;
  if (editingItem) delete payload.id;
  const res = await fetch(url, {method, headers:HEADERS(), body:JSON.stringify(payload)});
  if (!res.ok) throw new Error(await res.text());
}

async function saveAG() {
  const id = document.getElementById('f_id').value.trim();
  if (!id) throw new Error('ID is required');
  const payload = {
    id,
    name:       document.getElementById('f_name').value.trim(),
    group_id:   document.getElementById('f_group_id').value,
    color:      document.getElementById('f_color').value.trim(),
    confirmed:  document.getElementById('f_confirmed').value === 'true',
    sort_order: parseInt(document.getElementById('f_sort_order').value)||0,
    short_desc: document.getElementById('f_short_desc').value.trim(),
    tagline:    document.getElementById('f_tagline').value.trim(),
    inputs:     getArrayValues('agInputs'),
    outputs:    getArrayValues('agOutputs'),
  };
  const method = editingItem ? 'PATCH' : 'POST';
  const url    = editingItem
    ? `${BASE()}/agents?id=eq.${id}`
    : `${BASE()}/agents`;
  if (editingItem) delete payload.id;
  const res = await fetch(url, {method, headers:HEADERS(), body:JSON.stringify(payload)});
  if (!res.ok) throw new Error(await res.text());

  // Save steps — delete existing and reinsert
  await fetch(`${BASE()}/agent_steps?agent_id=eq.${id}`, {method:'DELETE', headers:HEADERS()});
  const rows = document.querySelectorAll('#stepsContainer .step-row');
  const steps = Array.from(rows).map((row, i) => {
    const inputs = row.querySelectorAll('input');
    const num  = inputs[0].value.trim();
    const name = inputs[1].value.trim();
    const desc = inputs[2].value.trim();
    if (!name) return null;
    return {agent_id:id, step_number:num||String(i+1), step_name:name, step_desc:desc, is_special:num==='★', sort_order:i+1};
  }).filter(Boolean);
  if (steps.length) {
    const sr = await fetch(`${BASE()}/agent_steps`, {method:'POST', headers:HEADERS(), body:JSON.stringify(steps)});
    if (!sr.ok) throw new Error(await sr.text());
  }
}

// ── DELETE ───────────────────────────────────────────────────
async function deleteItem(table, id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  try {
    // If deleting an agent, also delete its steps
    if (table === 'agents') {
      await fetch(`${BASE()}/agent_steps?agent_id=eq.${id}`, {method:'DELETE', headers:HEADERS()});
    }
    const res = await fetch(`${BASE()}/${table}?id=eq.${id}`, {method:'DELETE', headers:HEADERS()});
    if (!res.ok) throw new Error(await res.text());
    await loadAll();
    renderSection(curSection);
    toast(`"${name}" deleted`);
  } catch(e) {
    toast(e.message, true);
  }
}

// ── MODAL UTILS ──────────────────────────────────────────────
function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingItem=null; editingType=null; }
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===document.getElementById('modalOverlay')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

// ── TOAST ────────────────────────────────────────────────────
function toast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr?' err':'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// ── HELPERS FOR INLINE JSON BUTTONS ─────────────────────────
// These allow table buttons to pass full objects safely
window.editUC = editUC;
window.editAG = editAG;
</script>
</body>
</html>
